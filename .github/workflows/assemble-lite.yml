name: Assemble verified Lite release
on:
  workflow_dispatch:
    inputs:
      transfer_release_id:
        description: Temporary draft release containing verified Lite chunks
        required: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify and add Lite assets to v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRANSFER_RELEASE_ID: ${{ inputs.transfer_release_id }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request, urllib.parse
          repository = os.environ['REPOSITORY']
          api = 'https://api.github.com/repos/' + repository
          source_id = int(os.environ['TRANSFER_RELEASE_ID'])
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, url):
                  redirected = super().redirect_request(req, fp, code, msg, response_headers, url)
                  if urllib.parse.urlparse(req.full_url).hostname != urllib.parse.urlparse(url).hostname:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(SafeRedirect())
          def get(url, binary=False):
              request_headers = dict(headers)
              if binary: request_headers['Accept'] = 'application/octet-stream'
              return opener.open(urllib.request.Request(url, headers=request_headers), timeout=120)
          def read(url):
              with get(url) as response: return json.load(response)
          source = read(api + '/releases/' + str(source_id))
          assert source['draft'] and source['tag_name'].startswith('_transfer-lite-v1.0.0-')
          destination = read(api + '/releases/tags/v1.0.0')
          assert not destination['draft'] and not destination['prerelease'] and destination['id'] != source_id
          originals = {a['name']:(a['id'],a['size'],a['digest']) for a in destination['assets']}
          parts = read(api + '/releases/' + str(source_id) + '/assets?per_page=100')
          manifest_asset = next(a for a in parts if a['name'] == '__kfs-lite-transfer.json')
          with get(api + '/releases/assets/' + str(manifest_asset['id']), True) as response: manifest = json.load(response)
          filename = 'K-File-Station-v1.0.0-Lite-Windows-x64.zip'
          assert manifest['filename'] == filename and 0 < manifest['bytes'] < 600 * 1024**2
          assert pathlib.Path(filename).name == filename and len(manifest['sha256']) == 64
          available = {a['id']:a for a in parts}; digest = hashlib.sha256(); written = 0
          with open(filename,'wb') as output:
              for index, part in enumerate(manifest['parts'],1):
                  asset = available[part['id']]
                  assert asset['name'] == part['name'] and asset['name'].startswith('__kfs-lite-part-')
                  assert asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + part['sha256']
                  size = 0; part_digest = hashlib.sha256()
                  with get(api + '/releases/assets/' + str(part['id']),True) as response:
                      while chunk := response.read(4 * 1024**2):
                          output.write(chunk); digest.update(chunk); part_digest.update(chunk)
                          written += len(chunk); size += len(chunk)
                  assert size == part['bytes'] and part_digest.hexdigest() == part['sha256']
                  print('Verified Lite part',index,'/',len(manifest['parts']),flush=True)
          assert written == manifest['bytes'] and digest.hexdigest() == manifest['sha256']
          pathlib.Path('SHA256-Lite.txt').write_text(manifest['sha256']+'  '+filename+'\n',encoding='utf-8')
          for name in (filename,'SHA256-Lite.txt'):
              if name in originals: raise RuntimeError('Asset already exists; refusing to overwrite ' + name)
          subprocess.run(['gh','release','upload','v1.0.0',filename,'SHA256-Lite.txt','--repo',repository],check=True)
          final = read(api + '/releases/tags/v1.0.0')
          uploaded = next(a for a in final['assets'] if a['name'] == filename)
          assert uploaded['size'] == written and uploaded['digest'] == 'sha256:' + manifest['sha256']
          for name,identity in originals.items():
              asset = next(a for a in final['assets'] if a['name'] == name)
              assert (asset['id'],asset['size'],asset['digest']) == identity
          request = urllib.request.Request(api + '/releases/' + str(source_id),headers=headers,method='DELETE')
          with opener.open(request,timeout=30) as response: assert response.status == 204
          print('Verified Lite ZIP added; existing release assets preserved; private transfer draft removed.',flush=True)
