name: Build and verify Lite release
on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: SHA256 of the locally tested reproducible Lite ZIP
        required: true
permissions:
  contents: write
jobs:
  build-lite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build from the verified full release and publish matching bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, zipfile
          root=Path.cwd()
          # Restore exact Git blob bytes regardless of runner newline settings.
          for name in ('tools/package_lite.py','LITE-EDITION.md'):
              (root/name).write_bytes(subprocess.check_output(['git','show','HEAD:'+name]))
          release=root/'release';release.mkdir(exist_ok=True)
          repository=os.environ['REPOSITORY']
          details=json.loads(subprocess.check_output(['gh','api','repos/'+repository+'/releases/tags/v1.0.0']))
          assert not details['draft'] and not details['prerelease']
          originals={a['name']:(a['id'],a['size'],a['digest']) for a in details['assets']}
          full_name='K-File-Station-v1.0.0-Windows-x64.zip'
          lite_name='K-File-Station-v1.0.0-Lite-Windows-x64.zip'
          assert lite_name not in originals and 'SHA256-Lite.txt' not in originals
          full_digest='8284855bbc14e6f6268f0232cfb2aed9af3bf359f849dce05cfa10882a765cbf'
          assert originals[full_name][2]=='sha256:'+full_digest
          subprocess.run(['gh','release','download','v1.0.0','--repo',repository,'--pattern',full_name,'--dir',str(release)],check=True)
          with (release/full_name).open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==full_digest
          subprocess.run([sys.executable,'tools/package_lite.py'],check=True)
          path=release/lite_name
          with path.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual==os.environ['EXPECTED_SHA256'],('Reproducible ZIP differs',actual)
          count=0
          with zipfile.ZipFile(release/full_name) as full,zipfile.ZipFile(path) as lite:
              assert lite.testzip() is None
              names=lite.namelist();assert len(names)==len(set(names))
              expected={n for n in full.namelist() if '/engines/libreoffice/' not in n and '/engines/pandoc/' not in n}
              extras={'K文件处理台/LITE-EDITION.md','K文件处理台/source/tools/package_lite.py','K文件处理台/lite-manifest.json'}
              assert set(names)==expected|extras
              assert not any(n.startswith('K文件处理台/data/') for n in names)
              for name in expected-{'K文件处理台/README.md'}:
                  assert hashlib.sha256(full.read(name)).digest()==hashlib.sha256(lite.read(name)).digest(),name
                  count+=1
          print('All retained files identical; locally tested ZIP reproduced:',count,actual,flush=True)
          subprocess.run(['gh','release','upload','v1.0.0',str(path),str(release/'SHA256-Lite.txt'),'--repo',repository],check=True)
          final=json.loads(subprocess.check_output(['gh','api','repos/'+repository+'/releases/tags/v1.0.0']))
          uploaded=next(a for a in final['assets'] if a['name']==lite_name)
          assert uploaded['digest']=='sha256:'+actual and uploaded['size']==path.stat().st_size
          for name,identity in originals.items():
              asset=next(a for a in final['assets'] if a['name']==name)
              assert (asset['id'],asset['size'],asset['digest'])==identity
          print('Verified Lite package published. Existing release assets preserved.',flush=True)
